# Phase 1: chỉ cần PostgreSQL để chạy migration + demo local.
# backend/frontend/ai-service/evaluation-service sẽ được thêm dần ở các phase sau (mục 20 của prompt gốc).
services:
  postgres:
    image: postgres:16-alpine
    container_name: toeic-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: toeic_scoring
      POSTGRES_USER: toeic
      POSTGRES_PASSWORD: toeic_dev_only
    ports:
      - "5432:5432"
    volumes:
      - toeic_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toeic -d toeic_scoring"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  toeic_pgdata:
