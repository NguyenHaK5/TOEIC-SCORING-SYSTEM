name: Docker Publish (GHCR)

# PHASE8-ISSUE-05: CHỈ chạy khi tag phiên bản (v1.0.0...) hoặc kích hoạt thủ
# công — không push image mỗi lần push code, tránh làm đầy registry và đúng
# nguyên tắc "không over-engineering" (mục 10 prompt gốc). Không cần tạo
# secret nào thủ công: GITHUB_TOKEN có sẵn, đủ quyền push vào GitHub Container
# Registry (ghcr.io) của cùng repo.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend, evaluation]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tag
        id: vars
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=manual-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push ${{ matrix.service }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.service }}.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/toeic-${{ matrix.service }}:${{ steps.vars.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/toeic-${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
