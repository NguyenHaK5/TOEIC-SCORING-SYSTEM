name: Evaluation Service CI

on:
  push:
    branches: [main]
    paths:
      - "evaluation-service/**"
      - ".github/workflows/evaluation-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "evaluation-service/**"
      - ".github/workflows/evaluation-ci.yml"
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: evaluation-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            evaluation-service/requirements.txt
            evaluation-service/requirements-dev.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install ruff

      - name: Lint (ruff)
        # PHASE8-ISSUE-11: ruff là tool mới thêm ở Phase 8, chưa từng chạy
        # trên code Phase 5 — không chặn pipeline lần đầu, gỡ continue-on-error
        # sau khi Dragon đã chạy `ruff check app --fix` cục bộ 1 lần.
        continue-on-error: true
        run: ruff check app

      - name: Test (pytest)
        run: pytest -v

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-test-results
          path: evaluation-service/.pytest_cache
          retention-days: 14
